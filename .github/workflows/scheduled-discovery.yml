name: Scheduled GigRadar discovery

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger secure discovery run
        env:
          BASE_URL: ${{ secrets.GIGRADAR_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping: configure GIGRADAR_BASE_URL and CRON_SECRET repository secrets."
            exit 0
          fi
          case "$BASE_URL" in https://*) ;; *) echo "GIGRADAR_BASE_URL must use HTTPS"; exit 1 ;; esac
          curl --fail --silent --show-error --max-time 480 \
            -X POST "$BASE_URL/api/cron/discover" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json"
